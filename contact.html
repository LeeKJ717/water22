<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 - Water.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .water-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-cyan-50 min-h-screen">
    <!-- 헤더 -->
    <header class="water-gradient text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-4xl font-bold mb-2 text-center">Water.com</h1>
        </div>
    </header>

    <!-- 네비게이션 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4">
            <ul class="flex flex-wrap justify-center items-center space-x-1 md:space-x-4 py-4">
                <li><a href="index.html" class="px-4 py-2 rounded-lg text-gray-700 font-semibold hover:bg-blue-100 transition duration-300">홈</a></li>
                <li><a href="about.html" class="px-4 py-2 rounded-lg text-gray-700 font-semibold hover:bg-blue-100 transition duration-300">물이란?</a></li>
                <li><a href="uses.html" class="px-4 py-2 rounded-lg text-gray-700 font-semibold hover:bg-blue-100 transition duration-300">물의 활용</a></li>
                <li><a href="contact.html" class="px-4 py-2 rounded-lg bg-blue-500 text-white font-semibold hover:bg-blue-600 transition duration-300">문의하기</a></li>
            </ul>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="container mx-auto px-4 py-12">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-4xl font-bold text-gray-800 mb-8 text-center">문의하기</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- 연락처 정보 -->
                <section class="bg-white rounded-xl shadow-lg p-8">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">연락처 정보</h3>
                    <div class="space-y-6">
                        <div class="flex items-start space-x-4">
                            <div class="text-3xl">📧</div>
                            <div>
                                <h4 class="font-semibold text-lg text-gray-800 mb-1">이메일</h4>
                                <p class="text-gray-600">contact@water.com</p>
                            </div>
                        </div>
                        <div class="flex items-start space-x-4">
                            <div class="text-3xl">📞</div>
                            <div>
                                <h4 class="font-semibold text-lg text-gray-800 mb-1">전화번호</h4>
                                <p class="text-gray-600">02-1234-5678</p>
                            </div>
                        </div>
                        <div class="flex items-start space-x-4">
                            <div class="text-3xl">📍</div>
                            <div>
                                <h4 class="font-semibold text-lg text-gray-800 mb-1">주소</h4>
                                <p class="text-gray-600">서울특별시 강남구 테헤란로 123<br>Water Building 10층</p>
                            </div>
                        </div>
                        <div class="flex items-start space-x-4">
                            <div class="text-3xl">🕒</div>
                            <div>
                                <h4 class="font-semibold text-lg text-gray-800 mb-1">운영 시간</h4>
                                <p class="text-gray-600">평일: 09:00 - 18:00<br>주말 및 공휴일 휴무</p>
                            </div>
                        </div>
                    </div>

                    <!-- 소셜 미디어 -->
                    <div class="mt-8 pt-8 border-t border-gray-200">
                        <h4 class="font-semibold text-lg text-gray-800 mb-4 text-center">소셜 미디어</h4>
                        <div class="flex justify-center space-x-4">
                            <a href="#" class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center text-white hover:bg-blue-600 transition duration-300">
                                <span class="text-xl">f</span>
                            </a>
                            <a href="#" class="w-12 h-12 bg-blue-400 rounded-full flex items-center justify-center text-white hover:bg-blue-500 transition duration-300">
                                <span class="text-xl">t</span>
                            </a>
                            <a href="#" class="w-12 h-12 bg-pink-500 rounded-full flex items-center justify-center text-white hover:bg-pink-600 transition duration-300">
                                <span class="text-xl">i</span>
                            </a>
                            <a href="#" class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white hover:bg-blue-700 transition duration-300">
                                <span class="text-xl">in</span>
                            </a>
                        </div>
                    </div>
                </section>

                <!-- 문의 폼 -->
                <section class="bg-white rounded-xl shadow-lg p-8">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">문의하기</h3>
                    <form class="space-y-4" onsubmit="handleSubmit(event)">
                        <div>
                            <label for="name" class="block text-sm font-semibold text-gray-700 mb-2">이름</label>
                            <input type="text" id="name" name="name" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition duration-300">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">이메일</label>
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition duration-300">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-semibold text-gray-700 mb-2">전화번호</label>
                            <input type="tel" id="phone" name="phone"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition duration-300">
                        </div>
                        <div>
                            <label for="subject" class="block text-sm font-semibold text-gray-700 mb-2">제목</label>
                            <input type="text" id="subject" name="subject" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition duration-300">
                        </div>
                        <div>
                            <label for="message" class="block text-sm font-semibold text-gray-700 mb-2">메시지</label>
                            <textarea id="message" name="message" rows="5" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition duration-300 resize-none"></textarea>
                        </div>
                        <button type="submit"
                            class="w-full bg-blue-500 text-white py-3 rounded-lg font-semibold hover:bg-blue-600 transition duration-300 transform hover:scale-105">
                            문의하기
                        </button>
                    </form>
                </section>
            </div>

            <!-- 지도 섹션 -->
            <section class="bg-white rounded-xl shadow-lg p-8 mt-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-6 text-center">찾아오시는 길</h3>
                <div class="bg-gray-200 rounded-lg h-64 flex items-center justify-center">
                    <p class="text-gray-500">지도가 여기에 표시됩니다</p>
                </div>
            </section>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="water-gradient text-white py-8 mt-16">
        <div class="container mx-auto px-4 text-center">
            <p class="text-lg mb-2">© 2024 Water.com - 물의 모든 것</p>
            <p class="text-sm opacity-90">생명의 근원, 물을 소중히 여깁시다</p>
        </div>
    </footer>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            alert('문의가 접수되었습니다. 빠른 시일 내에 답변드리겠습니다.');
            event.target.reset();
        }
    </script>
</body>
</html>
